[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbox-web/netbox-omnisync"
# Internal crates of one binary: never published to a registry.
publish = false

[workspace.dependencies]
omnisync-core = { path = "crates/core" }
omnisync-netbox = { path = "crates/netbox" }
omnisync-proxmox = { path = "crates/proxmox" }
omnisync-vmware = { path = "crates/vmware" }
omnisync-redfish = { path = "crates/redfish" }
omnisync-cisco = { path = "crates/cisco" }
omnisync-fortios = { path = "crates/fortios" }
omnisync-tls = { path = "crates/tls" }
omnisync-ssh = { path = "crates/ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }
insta = "1"
indicatif = "0.18"
jiff = "1"
toml = { version = "1", features = ["preserve_order"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
futures = "0.3"
url = "2"
wiremock = "0.6"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
scraper = { version = "0.29", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
sha2 = "0.11"
# Hashed known_hosts entries (`|1|salt|hash`, HMAC-SHA1): the versions russh already brings.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# O_NOFOLLOW for the lock file: the version tokio already brings.
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
unicode-general-category = "1"
ipnet = "2"
console = "0.16"
roxmltree = "0.21"
# Reverse DNS lookups (dns_name_lookup): the stub resolver alone, over UDP and TCP, without DNSSEC nor DNS over TLS.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }

# No `unsafe` unless a block says why it is needed: `#[expect(unsafe_code, reason = "…")]`.
[workspace.lints.rust]
unsafe_code = "deny"
